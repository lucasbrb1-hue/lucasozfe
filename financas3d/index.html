<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--CONTEUDO-->
<title>Gastos em 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a cena 3D ocupa a tela inteira; barra de resumo no topo, painel da categoria
   flutuando à direita (vira folha inferior no celular), rótulos presos aos objetos. */
:root {
  --bg: #e9eef3;          /* céu da cena */
  --floor: #d5dde6;       /* piso */
  --grid: #b9c5d2;
  --surface: #ffffff;     /* painéis */
  --surface-2: #f1f4f8;
  --line: #d3dae3;
  --fg: #14202e;
  --muted: #5b6979;
  --accent: #2f5fe0;
  --on-accent: #ffffff;
  --ok: #1f9d63;
  --warn: #d98a00;
  --crit: #dc3b32;
  --glass: #9fb4c9;
  --shadow: 0 10px 30px rgba(20, 32, 46, .14);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c131c; --floor: #121c28; --grid: #22303f; --surface: #162130; --surface-2: #1d2a3b;
    --line: #2b3a4d; --fg: #e8eef5; --muted: #93a2b4; --accent: #6f95ff; --on-accent: #0b1220;
    --ok: #3ccf8a; --warn: #f5b13d; --crit: #ff5d52; --glass: #7f97b0;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c131c; --floor: #121c28; --grid: #22303f; --surface: #162130; --surface-2: #1d2a3b;
  --line: #2b3a4d; --fg: #e8eef5; --muted: #93a2b4; --accent: #6f95ff; --on-accent: #0b1220;
  --ok: #3ccf8a; --warn: #f5b13d; --crit: #ff5d52; --glass: #7f97b0;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 15px/1.45 var(--body); overflow: hidden;
}
*, *::before, *::after { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { position: relative; height: 100%; overflow: hidden; }
#cena { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }

/* Vinheta de alarme nas bordas da tela */
#vinheta { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s; }
#vinheta.warn { box-shadow: inset 0 0 110px -20px var(--warn); opacity: .55; }
#vinheta.crit { box-shadow: inset 0 0 150px -10px var(--crit); opacity: 1; animation: pulso 1.3s ease-in-out infinite; }
@keyframes pulso { 50% { opacity: .35; } }

/* Barra superior */
.topo {
  position: absolute; inset: 0 0 auto 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none; z-index: 3;
}
.topo > * { pointer-events: auto; }
.marca { font: 700 20px/1 var(--display); letter-spacing: -.01em; margin: 0; }
.mes { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.mes button { width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent; font-size: 16px; line-height: 1; }
.mes button:hover { background: var(--surface-2); }
.mes span { min-width: 9.5em; text-align: center; font-weight: 600; }
.total { display: flex; flex-direction: column; min-width: 0; }
.total small { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.total strong { font: 700 18px/1.2 var(--display); }
.total strong span { color: var(--muted); font: 500 13px var(--body); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface); border: 1px solid var(--line); }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.chip.crit { color: var(--crit); } .chip.warn { color: var(--warn); } .chip.ok { color: var(--ok); }
.acoes { margin-left: auto; display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 13px; font-weight: 600; }
.btn:hover { background: var(--surface-2); }
.btn.primario { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primario:hover { filter: brightness(1.08); background: var(--accent); }
.btn[aria-pressed]::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; border: 2px solid var(--muted); vertical-align: 1px; }
.btn[aria-pressed="true"]::before { background: var(--ok); border-color: var(--ok); }
.btn.perigo { color: var(--crit); }
.btn.bloco { width: 100%; }

/* Rótulos presos aos objetos */
.rotulo {
  position: absolute; left: 0; top: 0; pointer-events: auto; text-align: center; white-space: nowrap;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px 6px;
  box-shadow: var(--shadow); will-change: transform;
}
.rotulo b { display: block; font: 700 14px/1.2 var(--display); }
.rotulo span { display: block; font-size: 12px; color: var(--muted); }
.rotulo em { display: block; font-style: normal; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.rotulo.ok em { color: var(--ok); }
.rotulo.warn { border-color: var(--warn); } .rotulo.warn em { color: var(--warn); }
.rotulo.crit { border-color: var(--crit); background: var(--crit); color: #fff; }
.rotulo.crit span, .rotulo.crit em { color: #fff; }
.rotulo.sel { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Painel da categoria */
#painel {
  position: absolute; top: var(--topo-h, 76px); bottom: 16px; right: max(16px, env(safe-area-inset-right, 0px)); width: 340px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden; z-index: 4;
}
#painel .corpo { overflow-y: auto; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.cab { display: flex; align-items: center; gap: 10px; padding: 14px 12px 12px 18px; }
.cab i { width: 14px; height: 14px; border-radius: 4px; flex: none; }
.cab h2 { font: 700 20px/1.15 var(--display); margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.fechar { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 8px; font-size: 20px; line-height: 1; color: var(--muted); }
.fechar:hover { background: var(--surface-2); }
.situacao { border-radius: 12px; padding: 12px 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; }
.situacao.warn { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); }
.situacao.crit { background: color-mix(in srgb, var(--crit) 16%, var(--surface)); }
.situacao .valor { font: 700 26px/1.1 var(--display); }
.situacao .valor span { font: 500 13px var(--body); color: var(--muted); }
.situacao p { margin: 0; font-weight: 600; }
.situacao.ok p { color: var(--ok); } .situacao.warn p { color: var(--warn); } .situacao.crit p { color: var(--crit); }
.barra { position: relative; height: 10px; border-radius: 5px; background: var(--line); }
.barra > div { height: 100%; border-radius: 5px; max-width: 100%; transition: width .5s; }
.barra > u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); }
form { display: flex; flex-direction: column; gap: 10px; }
.campos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.campos .largo { grid-column: 1 / -1; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); min-width: 0; }
input[type="text"], input[type="date"], select {
  width: 100%; min-width: 0; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 15px;
}
input[type="range"] { width: 100%; accent-color: var(--warn); }
.erro { color: var(--crit); font-size: 13px; font-weight: 600; margin: 0; }
h3 { font: 700 13px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.lista { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.lista li { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.lista li div { min-width: 0; overflow-wrap: anywhere; }
.lista small { display: block; color: var(--muted); font-size: 12px; }
.lista .x { border: 0; background: transparent; color: var(--muted); width: 28px; height: 28px; border-radius: 7px; font-size: 16px; }
.lista .x:hover { background: var(--surface-2); color: var(--crit); }
.vazio { color: var(--muted); margin: 0; }
details summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
details form { padding-top: 8px; }

/* Avisos */
#toasts { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; width: min(440px, calc(100% - 32px)); pointer-events: none; z-index: 5; }
.toast { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; font-weight: 600; box-shadow: var(--shadow); background: var(--surface); border: 1px solid var(--line); animation: entra .25s ease-out; }
.toast.warn { background: var(--warn); border-color: var(--warn); color: #1d1300; }
.toast.crit { background: var(--crit); border-color: var(--crit); color: #fff; }
.toast button { margin-left: auto; border: 0; background: transparent; color: inherit; font-size: 18px; line-height: 1; padding: 0 2px; }
@keyframes entra { from { transform: translateY(-8px); opacity: 0; } }

/* Jogo: nível, XP, missões e recompensas */
.hud { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 14px 5px 6px; font-weight: 600; }
.hud:hover { background: var(--surface-2); }
.hud b { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 3px 10px; font: 700 13px var(--display); white-space: nowrap; }
.hud.pulo { animation: pulo .5s ease-out; }
@keyframes pulo { 40% { transform: scale(1.12); } }
.xpbar { display: block; width: 84px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .6s; }
.hud span.seq { font-size: 13px; color: var(--muted); white-space: nowrap; }
.nivel-bloco { border-radius: 12px; padding: 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 8px; }
.nivel-bloco strong { font: 700 22px/1.1 var(--display); }
.nivel-bloco .xpbar { width: 100%; height: 10px; }
.nivel-bloco p { margin: 0; color: var(--muted); }
.nivel-bloco p b { color: var(--fg); }
.jogo-lista { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; }
.jogo-lista li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); align-items: baseline; }
.jogo-lista li > div { min-width: 0; }
.jogo-lista small { display: block; color: var(--muted); font-size: 12px; }
.jogo-lista .st { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.jogo-lista li.ok .st { color: var(--ok); }
.jogo-lista li.falta { color: var(--muted); }
.toast.xp { border-color: var(--accent); }
.toast.nivel { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 16px; }

/* Balões de fala dos personagens */
#baloes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
.balao {
  position: absolute; left: 0; top: 0; max-width: 230px; width: max-content; padding: 7px 11px; border-radius: 13px;
  background: var(--surface); border: 2px solid var(--fg); font-weight: 600; font-size: 13px; line-height: 1.3; box-shadow: var(--shadow);
}
.balao::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 10px; height: 10px; margin-left: -5px; background: var(--surface); border: solid var(--fg); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.balao b { display: block; font: 700 11px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.balao.grito { background: var(--crit); border-color: var(--crit); color: #fff; font: 700 17px var(--display); }
.balao.grito::after { background: var(--crit); border-color: var(--crit); }
.toast.oferta { flex-wrap: wrap; align-items: center; }
.toast.oferta span { flex: 1 1 100%; }
.toast.oferta button { margin: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.toast.oferta button.sim { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

.rodape { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 14px; z-index: 3; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; max-width: calc(100% - 32px); }
.dica { color: var(--muted); font-size: 12.5px; margin: 0; }
.exemplo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--surface); border: 1px dashed var(--muted); border-radius: 12px; padding: 8px 12px; font-size: 13px; }

@media (max-width: 760px) {
  .marca { font-size: 17px; }
  .acoes { margin-left: 0; flex-wrap: wrap; }
  .btn { white-space: nowrap; padding: 7px 10px; font-size: 13.5px; }
  #painel { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 50%; border-radius: 16px 16px 0 0; border-width: 1px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  #toasts { top: calc(8px + env(safe-area-inset-top, 0px)); }
  .chips:empty { display: none; }
  .painel-aberto .hud { display: none; }
  .dica { display: none; }
  .painel-aberto .rodape { display: none; }
  .painel-aberto .total, .painel-aberto .chips, .painel-aberto .acoes { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .hud.pulo { animation: none; }
  #vinheta.crit { animation: none; }
  .toast { animation: none; }
}
</style>

<div id="app">
  <canvas id="cena" aria-label="Cena 3D com um objeto para cada categoria de gasto"></canvas>
  <div id="vinheta"></div>
  <div id="labels"></div>
  <div id="baloes" aria-live="off"></div>

  <header class="topo">
    <h1 class="marca">Gastos em 3D</h1>
    <div class="mes">
      <button type="button" id="mes-ant" aria-label="Mês anterior">‹</button>
      <span id="mes-nome"></span>
      <button type="button" id="mes-prox" aria-label="Próximo mês">›</button>
    </div>
    <div class="total"><small>Gasto no mês</small><strong class="num" id="total"></strong></div>
    <div class="chips" id="chips"></div>
    <button type="button" class="hud" id="hud" title="Ver nível, missões e recompensas"></button>
    <div class="acoes">
      <button type="button" class="btn" id="papo" aria-pressed="true" title="Liga ou pausa as conversas entre os personagens">Conversas</button>
      <button type="button" class="btn" id="som" aria-pressed="true" title="Liga ou desliga os sons de alerta">Som</button>
      <button type="button" class="btn primario" id="nova">+ Nova categoria</button>
    </div>
  </header>

  <div id="toasts" role="status" aria-live="polite"></div>
  <aside id="painel" hidden></aside>

  <div class="rodape">
    <div class="exemplo" id="exemplo" hidden>
      <span>Estes são dados de exemplo.</span>
      <button type="button" class="btn" id="zerar">Começar do zero</button>
    </div>
    <p class="dica">Arraste para girar · role para aproximar · clique em um objeto para lançar um gasto · lançar gastos dá XP e libera recompensas</p>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
(() => {
'use strict';

/* ---------- Dados ---------- */
const CHAVE = 'gastos3d.v1';
const CORES = ['#3b6ff0', '#11a39a', '#8a5cf0', '#9a6b3f', '#4c9a3f', '#1492c9', '#6b6fd6', '#7d8a2e'];
const brl = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const brl0 = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const hoje = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function exemplo() {
  const m = hoje().slice(0, 7);
  const cats = [
    ['Casa', 2200, [['Aluguel', 1500, '05'], ['Condomínio', 350, '08']]],
    ['Comida', 1200, [['Mercado', 420, '03'], ['Feira', 95, '07'], ['Restaurante', 180, '09']]],
    ['Transporte', 500, [['Combustível', 280, '02'], ['Corridas de app', 265, '10']]],
    ['Lazer', 400, [['Cinema', 60, '06'], ['Streaming', 55, '01']]],
    ['Saúde', 350, [['Farmácia', 120, '04']]],
  ];
  const s = { categorias: [], gastos: [], exemplo: true, som: true };
  cats.forEach(([nome, limite, gs], i) => {
    const id = 'c' + i;
    s.categorias.push({ id, nome, limite, alerta: 0.8, cor: CORES[i % CORES.length] });
    gs.forEach(([desc, valor, dia], j) => s.gastos.push({ id: id + 'g' + j, cat: id, desc, valor, data: `${m}-${dia}` }));
  });
  return s;
}
function carregar() {
  try {
    const s = JSON.parse(localStorage.getItem(CHAVE));
    if (s && Array.isArray(s.categorias) && Array.isArray(s.gastos)) return s;
  } catch (e) { /* sem armazenamento: segue com o exemplo */ }
  return exemplo();
}
function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) { /* ignora */ } }

let estado = carregar();
let mes = hoje().slice(0, 7);
let selecionada = null;      // id da categoria aberta no painel, ou 'nova'
let confirmarExclusao = false;

const gastosDe = id => estado.gastos.filter(g => g.cat === id && g.data.startsWith(mes));
const somaDe = id => gastosDe(id).reduce((t, g) => t + g.valor, 0);
function situacao(cat) {
  const gasto = somaDe(cat.id), r = cat.limite > 0 ? gasto / cat.limite : 0;
  const nivel = r >= 1 ? 'crit' : r >= cat.alerta ? 'warn' : 'ok';
  let texto, curto;
  if (r > 1) { texto = `Estourou o limite em ${brl.format(gasto - cat.limite)}`; curto = 'Estourou'; }
  else if (r === 1) { texto = 'Limite atingido'; curto = 'No limite'; }
  else if (nivel === 'warn') { texto = `Perto do limite: restam ${brl.format(cat.limite - gasto)}`; curto = 'Perto do limite'; }
  else { texto = `Restam ${brl.format(cat.limite - gasto)}`; curto = 'Dentro do limite'; }
  return { gasto, r, nivel, texto, curto };
}
function lerValor(txt) {
  let s = String(txt).replace(/[R$\s]/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN;
}

/* ---------- Jogo: XP, níveis, sequência, missões e conquistas ---------- */
const NIVEIS = [0, 100, 250, 450, 700, 1000, 1400];   // XP mínimo de cada nível (1 a 7)
const TITULOS = ['Iniciante', 'Anotador', 'Organizado', 'Poupador', 'Estrategista', 'Mestre do orçamento', 'Lenda'];
const PREMIOS = { 2: 'Bonés para os personagens', 3: 'Árvores na praça', 4: 'Troféu de bronze no centro da praça', 5: 'Coroas douradas para os personagens', 6: 'Troféu de ouro', 7: 'Fogos de artifício sobre a praça' };
const CONQUISTAS = [
  ['primeiro', 'Primeiro passo', 'Lance seu primeiro gasto', j => j.lancados >= 1],
  ['dez', 'Caderno em dia', 'Lance 10 gastos', j => j.lancados >= 10],
  ['cinquenta', 'Contador', 'Lance 50 gastos', j => j.lancados >= 50],
  ['seq3', 'Pegando o ritmo', 'Lance gastos 3 dias seguidos', j => j.melhorSeq >= 3],
  ['seq7', 'Semana perfeita', 'Lance gastos 7 dias seguidos', j => j.melhorSeq >= 7],
  ['seq30', 'Hábito formado', 'Lance gastos 30 dias seguidos', j => j.melhorSeq >= 30],
  ['paz', 'Pacificador', 'Aceite uma ajuda entre categorias', j => j.ajudas >= 1],

  });

  for (let i = moedas.length - 1; i >= 0; i--) {
    const c = moedas[i]; c.v += 22 * dt; c.m.position.y -= c.v * dt; c.m.rotation.z += dt * 12;
    if (c.m.position.y <= c.chao) { scene.remove(c.m); moedas.splice(i, 1); }
  }
  agoraS = s; tickCena(s); animarBonecos(s, dt, w, h); animarConfete(s, dt);
  renderer.render(scene, camera);
  requestAnimationFrame(quadro);
}

/* ---------- Interface ---------- */
function montarRotulos() {
  const cx = $('labels'); cx.innerHTML = '';
  tanques.forEach((t, id) => {
    const b = document.createElement('button');
    b.type = 'button'; b.onclick = () => selecionar(id);
    cx.append(b); t.rotulo = b;
  });
  atualizar();
}
function atualizar() {
  const d = new Date(mes + '-15T12:00:00');
  const nomeMes = d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  $('mes-nome').textContent = nomeMes[0].toUpperCase() + nomeMes.slice(1);
  let total = 0, limite = 0; const cont = { crit: 0, warn: 0 };
  tanques.forEach((t, id) => {
    const st = situacao(t.cat); total += st.gasto; limite += t.cat.limite; if (st.nivel !== 'ok') cont[st.nivel]++;
    t.rotulo.className = `rotulo ${st.nivel}${id === selecionada ? ' sel' : ''}`;
    t.rotulo.innerHTML = `<b>${esc(t.cat.nome)}</b><span class="num">${brl0.format(st.gasto)} de ${brl0.format(t.cat.limite)} · ${Math.round(st.r * 100)}%</span>${st.nivel === 'ok' ? '' : `<em>${st.curto}</em>`}`;
  });
  $('total').innerHTML = `${brl.format(total)} <span>de ${brl.format(limite)}</span>`;
  const chips = [];
  if (cont.crit) chips.push(`<span class="chip crit">${cont.crit} ${cont.crit > 1 ? 'estouradas' : 'estourada'}</span>`);
  if (cont.warn) chips.push(`<span class="chip warn">${cont.warn} perto do limite</span>`);
  if (!chips.length && tanques.size) chips.push('<span class="chip ok">Tudo dentro do limite</span>');
  $('chips').innerHTML = chips.join('');
  $('vinheta').className = cont.crit ? 'crit' : cont.warn ? 'warn' : '';
  const j = J(), nvA = nivelDe(j.xp), ini = NIVEIS[nvA - 1], fim = NIVEIS[nvA];
  const seqViva = j.ultimoDia === hoje() || j.ultimoDia === ontem() ? j.seq : 0;
  $('hud').innerHTML = `<b>Nível ${nvA}</b><span class="xpbar"><i style="width:${fim ? (j.xp - ini) / (fim - ini) * 100 : 100}%"></i></span><span class="seq num">${seqViva} ${seqViva === 1 ? 'dia seguido' : 'dias seguidos'}</span>`;
  $('exemplo').hidden = !estado.exemplo;
  $('som').setAttribute('aria-pressed', String(!!estado.som));
  $('papo').setAttribute('aria-pressed', String(estado.conversas !== false));
  desenharPainel();
  app.style.setProperty('--topo-h', (document.querySelector('.topo').offsetHeight + 4) + 'px');
}

function selecionar(id) {
  selecionada = id; confirmarExclusao = false; focar(); atualizar();
  if (id) { const campo = $('g-valor') || $('n-nome'); if (campo && app.clientWidth > 760) campo.focus(); }
}

function desenharPainel(erro = '') {
  const p = $('painel');
  app.classList.toggle('painel-aberto', !!selecionada);
  if (!selecionada) { p.hidden = true; p.innerHTML = ''; return; }
  // preserva o que estava sendo digitado
  const digitado = {}; p.querySelectorAll('input, select').forEach(i => { digitado[i.id] = i.value; });
  const foco = document.activeElement && p.contains(document.activeElement) ? document.activeElement.id : null;
  const aberto = p.querySelector('details') ? p.querySelector('details').open : false;
  const idAntes = p.dataset.id;
  p.hidden = false; p.dataset.id = selecionada;

  if (selecionada === 'jogo') {
    const j = J(), nv = nivelDe(j.xp), ini = NIVEIS[nv - 1], fim = NIVEIS[nv];
    const seq = j.ultimoDia === hoje() || j.ultimoDia === ontem() ? j.seq : 0;
    p.innerHTML = `
      <div class="cab"><h2>Sua jornada</h2><button type="button" class="fechar" data-acao="fechar" aria-label="Fechar">×</button></div>
      <div class="corpo">
        <div class="nivel-bloco">
          <strong>Nível ${nv} · ${TITULOS[nv - 1]}</strong>
          <span class="xpbar"><i style="width:${fim ? (j.xp - ini) / (fim - ini) * 100 : 100}%"></i></span>
          <p class="num">${fim ? `<b>${j.xp} XP</b> · faltam ${fim - j.xp} para o nível ${nv + 1}` : `<b>${j.xp} XP</b> · nível máximo`}</p>
          ${fim ? `<p>Próxima recompensa: <b>${PREMIOS[nv + 1]}</b></p>` : ''}
          <p><b>${seq} ${seq === 1 ? 'dia seguido' : 'dias seguidos'}</b> lançando gastos${j.melhorSeq ? ` (recorde: ${j.melhorSeq})` : ''}. ${j.ultimoDia === hoje() ? 'Hoje já está garantido.' : 'Lance um gasto hoje para ' + (seq ? 'manter a sequência.' : 'começar uma.')}</p>
        </div>
        <div><h3>Missões</h3><ul class="jogo-lista">${missoes().map(m => `<li class="${m.feito >= m.meta ? 'ok' : ''}"><div>${m.nome}<small>+${m.xp} XP</small></div><span class="st num">${m.feito >= m.meta ? 'Concluída' : `${m.feito} de ${m.meta}`}</span></li>`).join('')}</ul></div>
        <div><h3>Recompensas</h3><ul class="jogo-lista">${Object.entries(PREMIOS).map(([n, nome]) => `<li class="${nv >= n ? 'ok' : 'falta'}"><div>${nome}<small>Nível ${n} · ${NIVEIS[n - 1]} XP</small></div><span class="st">${nv >= n ? 'Liberada' : 'Bloqueada'}</span></li>`).join('')}</ul></div>
        <div><h3>Conquistas</h3><ul class="jogo-lista">${CONQUISTAS.map(([id, nome, desc]) => `<li class="${j.conquistas[id] ? 'ok' : 'falta'}"><div>${nome}<small>${desc}</small></div><span class="st">${j.conquistas[id] ? 'Conquistada' : '+30 XP'}</span></li>`).join('')}</ul></div>
        <div><h3>Como ganhar XP</h3><ul class="jogo-lista">
          <li><div>Lançar um gasto<small>Vale para os 5 primeiros de cada dia</small></div><span class="st">+10 XP</span></li>
          <li><div>Primeiro gasto do dia<small>Mais um bônus que cresce com os dias seguidos</small></div><span class="st">+15 XP</span></li>
          <li><div>Abrir o dia dentro do limite<small>Por categoria que não passou do ponto de alerta</small></div><span class="st">+5 XP</span></li>
          <li><div>Aceitar a ajuda de uma categoria<small>Quando um personagem oferece parte do limite</small></div><span class="st">+20 XP</span></li>
        </ul></div>
      </div>`;
  } else if (selecionada === 'nova') {
    p.innerHTML = `
      <div class="cab"><h2>Nova categoria</h2><button type="button" class="fechar" data-acao="fechar" aria-label="Fechar">×</button></div>
      <div class="corpo"><form id="f-nova" novalidate>
        <label>Nome<input type="text" id="n-nome" maxlength="24" placeholder="Ex.: Educação" autocomplete="off"></label>
        <label>Limite mensal (R$)<input type="text" id="n-limite" inputmode="decimal" placeholder="0,00" autocomplete="off"></label>
        <label>Formato<select id="n-forma"><option value="">Automático (pelo nome)</option>${Object.entries(FORMAS).map(([v, n]) => `<option value="${v}"${'' === v ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
        <label>Avisar ao chegar em <output id="n-alerta-v">80%</output><input type="range" id="n-alerta" min="50" max="100" step="5" value="80"></label>
        ${erro ? `<p class="erro">${esc(erro)}</p>` : ''}
        <button type="submit" class="btn primario bloco">Criar categoria</button>
      </form></div>`;
  } else {
    const cat = estado.categorias.find(c => c.id === selecionada);
    if (!cat) { selecionada = null; return desenharPainel(); }
    const st = situacao(cat), lista = gastosDe(cat.id).sort((a, b) => b.data.localeCompare(a.data));
    const dataPadrao = mes === hoje().slice(0, 7) ? hoje() : mes + '-01';
    p.innerHTML = `
      <div class="cab"><i style="background:${cat.cor}"></i><h2>${esc(cat.nome)}</h2><button type="button" class="fechar" data-acao="fechar" aria-label="Fechar">×</button></div>
      <div class="corpo">
        <div class="situacao ${st.nivel}">
          <div class="valor num">${brl.format(st.gasto)} <span>de ${brl.format(cat.limite)}</span></div>
          <div class="barra"><div style="width:${Math.min(100, st.r * 100)}%;background:var(--${st.nivel})"></div><u style="left:${cat.alerta * 100}%" title="Ponto de alerta"></u></div>
          <p>${esc(st.texto)}</p>
        </div>
        <form id="f-gasto" novalidate>
          <h3>Lançar gasto</h3>
          <div class="campos">
            <label>Valor (R$)<input type="text" id="g-valor" inputmode="decimal" placeholder="0,00" autocomplete="off"></label>
            <label>Data<input type="date" id="g-data" value="${dataPadrao}"></label>
            <label class="largo">Descrição<input type="text" id="g-desc" maxlength="40" placeholder="Ex.: Mercado" autocomplete="off"></label>
          </div>
          ${erro ? `<p class="erro">${esc(erro)}</p>` : ''}
          <button type="submit" class="btn primario bloco">Adicionar gasto</button>
        </form>
        <div>
          <h3>Gastos do mês</h3>
          ${lista.length ? `<ul class="lista">${lista.map(g => `<li><div>${esc(g.desc || 'Sem descrição')}<small>${g.data.slice(8)}/${g.data.slice(5, 7)}</small></div><span class="num">${brl.format(g.valor)}</span><button type="button" class="x" data-acao="remover" data-id="${g.id}" aria-label="Remover ${esc(g.desc || 'gasto')}">×</button></li>`).join('')}</ul>` : '<p class="vazio">Nenhum gasto lançado neste mês.</p>'}
        </div>
        <details ${aberto && idAntes === selecionada ? 'open' : ''}>
          <summary>Limite e alerta</summary>
          <form id="f-config" novalidate>
            <label>Nome<input type="text" id="c-nome" maxlength="24" value="${esc(cat.nome)}" autocomplete="off"></label>
            <label>Limite mensal (R$)<input type="text" id="c-limite" inputmode="decimal" value="${cat.limite.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}" autocomplete="off"></label>
            <label>Formato<select id="c-forma"><option value="">Automático (pelo nome)</option>${Object.entries(FORMAS).map(([v, n]) => `<option value="${v}"${cat.forma === v ? ' selected' : ''}>${n}</option>`).join('')}</select></label>
            <label>Avisar ao chegar em <output id="c-alerta-v">${Math.round(cat.alerta * 100)}%</output><input type="range" id="c-alerta" min="50" max="100" step="5" value="${Math.round(cat.alerta * 100)}"></label>
            <button type="submit" class="btn bloco">Salvar</button>
            <button type="button" class="btn perigo bloco" data-acao="excluir">${confirmarExclusao ? 'Confirmar: excluir categoria e seus gastos' : 'Excluir categoria'}</button>
          </form>
        </details>
      </div>`;
  }
  if (idAntes === selecionada) {
    for (const [id, v] of Object.entries(digitado)) { const i = $(id); if (i && id[0] !== 'c' && v) i.value = v; }
    if (foco && $(foco)) $(foco).focus();
  }
  p.querySelectorAll('input[type="range"]').forEach(r => { r.oninput = () => { $(r.id + '-v').textContent = r.value + '%'; }; r.oninput(); });
}

$('painel').addEventListener('click', ev => {
  const b = ev.target.closest('[data-acao]'); if (!b) return;
  const acao = b.dataset.acao;
  if (acao === 'fechar') selecionar(null);
  if (acao === 'remover') { estado.gastos = estado.gastos.filter(g => g.id !== b.dataset.id); salvar(); atualizar(); }
  if (acao === 'excluir') {
    if (!confirmarExclusao) { confirmarExclusao = true; desenharPainel(); return; }
    const nome = estado.categorias.find(c => c.id === selecionada).nome;
    estado.categorias = estado.categorias.filter(c => c.id !== selecionada);
    estado.gastos = estado.gastos.filter(g => g.cat !== selecionada);
    selecionada = null; confirmarExclusao = false; salvar(); montarCena(); focar();
    aviso(`Categoria ${nome} excluída.`);
  }
});

$('painel').addEventListener('submit', ev => {
  ev.preventDefault();
  const f = ev.target.id;
  if (f === 'f-gasto') {
    const cat = estado.categorias.find(c => c.id === selecionada);
    const valor = lerValor($('g-valor').value), data = $('g-data').value || hoje();
    if (!(valor > 0)) { desenharPainel('Informe um valor maior que zero, por exemplo 45,90.'); $('g-valor').focus(); return; }
    const antes = situacao(cat).nivel;
    estado.gastos.push({ id: novoId(), cat: cat.id, valor, desc: $('g-desc').value.trim(), data, criado: hoje() });
    mes = data.slice(0, 7); salvar();
    $('g-valor').value = ''; $('g-desc').value = '';
    soltarMoeda(cat.id); atualizar(); $('g-valor').focus();
    const st = situacao(cat);
    if (st.nivel !== 'ok') { alunoForcado = cat.id; if (!cena) proximaCena = agoraS + 1.5; }
    if (st.nivel === 'crit') { aviso(`${cat.nome}: ${st.texto[0].toLowerCase() + st.texto.slice(1)}.`, 'crit'); bip('crit'); }
    else if (st.nivel === 'warn') { aviso(`Atenção, ${cat.nome} chegou a ${Math.round(st.r * 100)}% do limite. Restam ${brl.format(cat.limite - st.gasto)}.`, 'warn'); if (antes !== 'warn') bip('warn'); }
    pontuarGasto();
  }
  if (f === 'f-config') {
    const cat = estado.categorias.find(c => c.id === selecionada);
    const nome = $('c-nome').value.trim(), limite = lerValor($('c-limite').value);
    if (!nome || !(limite > 0)) { aviso('Informe um nome e um limite maior que zero.', 'warn'); return; }
    cat.nome = nome; cat.limite = limite; cat.alerta = Number($('c-alerta').value) / 100; cat.forma = $('c-forma').value || undefined;
    salvar(); montarCena(); focar(); aviso('Limite salvo.');
  }
  if (f === 'f-nova') {
    const nome = $('n-nome').value.trim(), limite = lerValor($('n-limite').value);
    if (!nome) { desenharPainel('Dê um nome à categoria.'); $('n-nome').focus(); return; }
    if (!(limite > 0)) { desenharPainel('Informe um limite maior que zero, por exemplo 500,00.'); $('n-limite').focus(); return; }
    const usadas = new Set(estado.categorias.map(c => c.cor));
    const cat = { id: novoId(), nome, limite, alerta: Number($('n-alerta').value) / 100, forma: $('n-forma').value || undefined, cor: CORES.find(c => !usadas.has(c)) || CORES[estado.categorias.length % CORES.length] };
    estado.categorias.push(cat); salvar();
    selecionada = cat.id; $('painel').dataset.id = ''; J().criadas++; montarCena(); focar(); fecharGanhos();
  }
});

function mudarMes(d) {
  const [a, m] = mes.split('-').map(Number), n = new Date(a, m - 1 + d, 1);
  mes = `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}`; atualizar();
}
$('mes-ant').onclick = () => mudarMes(-1);
$('mes-prox').onclick = () => mudarMes(1);
$('nova').onclick = () => selecionar('nova');
$('hud').onclick = () => selecionar(selecionada === 'jogo' ? null : 'jogo');
$('som').onclick = () => { estado.som = !estado.som; salvar(); atualizar(); if (estado.som) bip('warn'); };
$('papo').onclick = () => { estado.conversas = estado.conversas === false; salvar(); if (estado.conversas === false) cancelarCena(); else proximaCena = agoraS + 1; atualizar(); };
$('zerar').onclick = () => { estado = { categorias: [], gastos: [], exemplo: false, som: estado.som, conversas: estado.conversas, jogo: estado.jogo }; salvar(); selecionada = 'nova'; montarCena(); focar(); };
window.addEventListener('keydown', ev => { if (ev.key === 'Escape' && selecionada) selecionar(null); });

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTema);
new MutationObserver(aplicarTema).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

redimensionar(); montarCena(); focar(); bonusDoDia();
orbita.raio = orbita.raioAlvo * 1.25;
requestAnimationFrame(quadro);
})();
</script>
