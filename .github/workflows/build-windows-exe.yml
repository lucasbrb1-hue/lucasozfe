name: Build Windows executable

on:
  push:
    branches:
      - claude/spt-pile-calculation-software-mkddw6
    paths:
      - "spt_piles/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name spt_estacas `
            --add-data "spt_piles;spt_piles" `
            --collect-data docx `
            main.py

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: spt_estacas-windows
          path: dist/spt_estacas.exe
          if-no-files-found: error

      - name: Publish/update release with the executable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-latest
          name: "spt_estacas.exe (build mais recente - Windows)"
          body: |
            Executável Windows gerado automaticamente pelo GitHub Actions a partir do
            commit ${{ github.sha }} da branch `${{ github.ref_name }}`.

            Baixe `spt_estacas.exe` abaixo e rode diretamente - não é necessário
            instalar Python nem nenhuma dependência. Esta release é atualizada
            automaticamente a cada novo build; o link permanece o mesmo.
          prerelease: true
          files: dist/spt_estacas.exe
